<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Empréstimos</title>
<meta name="theme-color" content="#0b5f5f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:light dark;
  --bg:#f3f5f6; --surface:#ffffff; --ink:#14202b; --muted:#5d6b78; --line:#dde3e8;
  --accent:#0b6e6e; --accent-ink:#ffffff; --pay:#1b7a43; --pay-bg:#e4f3ea; --danger:#b3261e; --loan-bg:#e8eef3;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f161c; --surface:#17212a; --ink:#e8eef3; --muted:#93a1ad; --line:#26333f;
  --accent:#4fc3bd; --accent-ink:#06201f; --pay:#6fd39a; --pay-bg:#17301f; --danger:#ff8a80; --loan-bg:#202d38}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.4;
  padding-top:max(20px,env(safe-area-inset-top,0px));padding-bottom:110px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font-size:20px;font-weight:600;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.hbtns{display:flex;gap:8px}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--muted)}
.total{background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:18px}
.total .lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.total .val{font-size:34px;font-weight:500;margin-top:4px}
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.person{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.person h2{margin:0;font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.person .owed{font-size:24px;font-weight:500;margin:4px 0 10px}
.rows{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:13px;color:var(--muted)}
.rows .num{color:var(--ink);text-align:right}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item{border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.line{width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;background:none;border:0;padding:12px 14px;min-height:56px}
.date{font-size:12px;color:var(--muted);width:58px}
.who{min-width:0}
.who b{font-weight:500}
.who small{display:block;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.amt{font-size:15px;white-space:nowrap}
.amt.pay{color:var(--pay)}
.tag{display:inline-block;font-size:11px;border-radius:4px;padding:1px 6px;margin-left:6px;background:var(--loan-bg);color:var(--muted)}
.tag.pay{background:var(--pay-bg);color:var(--pay)}
.actions{display:flex;gap:8px;padding:0 14px 12px;justify-content:flex-end}
.actions button{border:1px solid var(--line);background:none;border-radius:8px;padding:8px 14px;font-size:13px}
.actions .del{color:var(--danger);border-color:currentColor}
.actions .del.arm{background:var(--danger);color:var(--surface);border-color:var(--danger)}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.banner{border:1px dashed var(--line);border-radius:10px;padding:12px 14px;color:var(--muted);font-size:13px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px max(16px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(to top,var(--bg) 70%,transparent);display:flex;justify-content:center;pointer-events:none}
.add{pointer-events:auto;width:100%;max-width:560px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:15px;font-weight:600;font-size:16px}
.scrim{position:fixed;inset:0;background:rgba(10,16,22,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:14px;max-height:92%;overflow:auto}
.sheet h3{margin:0;font-size:17px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:none;padding:10px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted)}
input{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:16px;color:var(--ink);min-width:0;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pchips{display:flex;gap:6px;flex-wrap:wrap}
.pchips .chip{padding:4px 12px}
.row2{display:flex;gap:10px}
.row2 button{flex:1;border-radius:10px;padding:13px;font-weight:600;border:1px solid var(--line);background:none}
.row2 .ok{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.row2 button:disabled{opacity:.6}
.err{color:var(--danger);font-size:13px;min-height:1em}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:10px;font-size:13px;z-index:30;max-width:90%}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:0}}}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Controle de Empréstimos</h1>
      <div class="sub" id="sub"></div>
    </div>
    <div class="hbtns">
      <button class="ghost" id="refreshBtn" type="button" aria-label="Atualizar">Atualizar</button>
      <button class="ghost" id="rateBtn" type="button">Ajustes</button>
    </div>
  </header>
  <div class="banner" id="banner" hidden></div>
  <section class="total" aria-live="polite"><div class="lbl">Total devido hoje</div><div class="val num" id="total">R$ 0,00</div></section>
  <section class="people" id="people"></section>
  <div class="chips" id="filters" role="group" aria-label="Filtrar por pessoa"></div>
  <section class="list" id="list"></section>
</main>
<div class="bar"><button class="add" id="addBtn" type="button">+ Novo lançamento</button></div>
<div id="overlay"></div>
<div id="toastHost"></div>

<script>
(function(){
  var brl=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
  var $=function(s){return document.querySelector(s)};
  var state={entries:[],rate:0.0814,filter:'todos',open:null,ready:false,offline:false};
  var conn={url:'',key:''};

  function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  var DEFAULT_URL='https://script.google.com/macros/s/AKfycbyduzmCIscbqP2-2urCXexO_OMCm0ZVQQLgbDVFChnoqBr5y_E1bsf16cqK9hrwypgz/exec';
  function loadConn(){conn.url=lsGet('emp_url')||DEFAULT_URL;conn.key=lsGet('emp_key')||''}
  function loadCache(){
    try{var c=JSON.parse(lsGet('emp_cache')||'null');if(c){state.entries=c.entries||[];state.rate=c.rate||state.rate}}catch(e){}
  }
  function saveCache(){lsSet('emp_cache',JSON.stringify({entries:state.entries,rate:state.rate}))}

  function todayStr(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  function dayNum(s){var p=s.split('-').map(Number);return Date.UTC(p[0],p[1]-1,p[2])/864e5}
  function fmtDate(s){var p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0].slice(2)}
  function rateText(){return state.rate.toLocaleString('pt-BR',{maximumFractionDigits:4})+'% ao dia'}

  // Juros compostos diários sobre o saldo; cada pagamento abate o saldo na data em que foi feito.
  function calc(entries,ratePct,today){
    var r=ratePct/100,by={};
    var sorted=entries.slice().sort(function(a,b){
      return a.data<b.data?-1:a.data>b.data?1:(a.tipo==='emprestimo'?0:1)-(b.tipo==='emprestimo'?0:1)});
    sorted.forEach(function(e){
      var p=by[e.pessoa]||(by[e.pessoa]={loans:0,paid:0,bal:0,last:dayNum(e.data)});
      var d=dayNum(e.data);
      if(p.bal>0&&d>p.last)p.bal*=Math.pow(1+r,d-p.last);
      if(d>p.last)p.last=d;
      if(e.tipo==='emprestimo'){p.loans+=e.valor;p.bal+=e.valor}else{p.paid+=e.valor;p.bal-=e.valor}
    });
    var t=dayNum(today);
    Object.keys(by).forEach(function(k){
      var p=by[k];
      if(p.bal>0&&t>p.last)p.bal*=Math.pow(1+r,t-p.last);
      p.interest=p.bal-(p.loans-p.paid);
    });
    return by;
  }

  function el(tag,cls,text){var n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=text;return n}
  function toast(msg){var t=el('div','toast',msg);$('#toastHost').appendChild(t);setTimeout(function(){t.remove()},3200)}
  function people(){var s={};state.entries.forEach(function(e){s[e.pessoa]=1});return Object.keys(s).sort()}

  /* ---------- API (Google Apps Script sobre a planilha) ---------- */
  function apply(j){
    if(j.error)throw new Error(j.error);
    state.entries=j.entries||[];if(typeof j.rate==='number'&&j.rate>0)state.rate=j.rate;
    state.ready=true;state.offline=false;saveCache();$('#banner').hidden=true;render();
  }
  function apiGet(){
    return fetch(conn.url+(conn.url.indexOf('?')<0?'?':'&')+'key='+encodeURIComponent(conn.key)).then(function(r){return r.json()});
  }
  function apiPost(body){
    body.key=conn.key;
    return fetch(conn.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)})
      .then(function(r){return r.json()}).then(function(j){apply(j);return j});
  }
  function refresh(quiet){
    if(!conn.key)return Promise.resolve();
    return apiGet().then(apply).catch(function(){
      state.ready=true;state.offline=true;
      var b=$('#banner');b.hidden=false;b.textContent='Sem conexão com a planilha. Mostrando os últimos dados salvos neste aparelho.';render();
      if(!quiet)toast('Não foi possível atualizar');
    });
  }

  /* ---------- Tela principal ---------- */
  function render(){
    $('#sub').textContent='Juros de '+rateText()+' · hoje '+fmtDate(todayStr());
    var by=calc(state.entries,state.rate,todayStr()),names=Object.keys(by).sort(),total=0;
    var box=$('#people');box.textContent='';
    names.forEach(function(n){
      var p=by[n];total+=p.bal;
      var c=el('article','person');
      c.appendChild(el('h2',null,n));
      c.appendChild(el('div','owed num',brl.format(p.bal)));
      var rows=el('div','rows');
      [['Emprestado',p.loans],['Pago',p.paid],['Juros',p.interest]].forEach(function(r){
        rows.appendChild(el('span',null,r[0]));rows.appendChild(el('span','num',brl.format(r[1])));
      });
      c.appendChild(rows);box.appendChild(c);
    });
    $('#total').textContent=brl.format(total);

    if(state.filter!=='todos'&&names.indexOf(state.filter)<0)state.filter='todos';
    var f=$('#filters');f.textContent='';
    ['todos'].concat(names).forEach(function(n){
      var b=el('button','chip',n==='todos'?'Todos':n);b.type='button';
      b.setAttribute('aria-pressed',String(state.filter===n));
      b.onclick=function(){state.filter=n;state.open=null;render()};
      f.appendChild(b);
    });

    var list=$('#list');list.textContent='';
    var rows2=state.entries.filter(function(e){return state.filter==='todos'||e.pessoa===state.filter})
      .sort(function(a,b){return a.data<b.data?1:a.data>b.data?-1:0});
    if(!rows2.length){
      list.appendChild(el('div','empty',state.ready?'Nenhum lançamento ainda. Toque em "Novo lançamento" para começar.':'Carregando…'));
      return;
    }
    rows2.forEach(function(e){
      var item=el('div','item'),pay=e.tipo==='pagamento';
      var line=el('button','line');line.type='button';
      line.setAttribute('aria-expanded',String(state.open===e.id));
      line.appendChild(el('span','date num',fmtDate(e.data)));
      var who=el('span','who'),b=el('b',null,e.pessoa);who.appendChild(b);
      b.appendChild(el('span','tag'+(pay?' pay':''),pay?'pago':'emprestado'));
      if(e.obs)who.appendChild(el('small',null,e.obs));
      line.appendChild(who);
      line.appendChild(el('span','amt num'+(pay?' pay':''),(pay?'− ':'')+brl.format(e.valor)));
      line.onclick=function(){state.open=state.open===e.id?null:e.id;render()};
      item.appendChild(line);
      if(state.open===e.id){
        var a=el('div','actions');
        var ed=el('button',null,'Editar');ed.type='button';ed.onclick=function(){openForm(e)};
        var del=el('button','del','Excluir');del.type='button';
        del.onclick=function(){
          if(!del.classList.contains('arm')){del.classList.add('arm');del.textContent='Confirmar exclusão';return}
          del.disabled=true;
          apiPost({action:'delete',id:e.id}).then(function(){state.open=null;render();toast('Lançamento excluído')},
            function(){del.disabled=false;toast('Não foi possível excluir. Verifique a conexão.')});
        };
        a.appendChild(ed);a.appendChild(del);item.appendChild(a);
      }
      list.appendChild(item);
    });
  }

  function parseMoney(s){
    s=String(s).replace(/[R$\s]/g,'');
    if(s.indexOf(',')>=0)s=s.replace(/\./g,'').replace(',','.');
    var n=parseFloat(s);return isFinite(n)?Math.round(n*100)/100:NaN;
  }
  function closeOverlay(){$('#overlay').textContent=''}
  function field(label,id,attrs){
    var l=el('label',null,label),i=document.createElement('input');i.id=id;
    Object.keys(attrs||{}).forEach(function(k){i.setAttribute(k,attrs[k])});l.appendChild(i);return [l,i];
  }
  function sheetShell(title){
    var scrim=el('div','scrim'),sheet=el('form','sheet');
    scrim.onclick=function(ev){if(ev.target===scrim)closeOverlay()};
    sheet.appendChild(el('h3',null,title));
    scrim.appendChild(sheet);$('#overlay').appendChild(scrim);
    return sheet;
  }

  function openForm(entry){
    closeOverlay();
    var editing=!!entry,tipo=editing?entry.tipo:'emprestimo';
    var sheet=sheetShell(editing?'Editar lançamento':'Novo lançamento');
    var seg=el('div','seg'),bL=el('button',null,'Empréstimo'),bP=el('button',null,'Pagamento');
    bL.type=bP.type='button';
    function setTipo(t){tipo=t;bL.setAttribute('aria-pressed',String(t==='emprestimo'));bP.setAttribute('aria-pressed',String(t==='pagamento'))}
    bL.onclick=function(){setTipo('emprestimo')};bP.onclick=function(){setTipo('pagamento')};
    seg.appendChild(bL);seg.appendChild(bP);sheet.appendChild(seg);setTipo(tipo);
    var two=el('div','two');
    var fv=field('Valor (R$)','f-valor',{inputmode:'decimal',placeholder:'0,00',autocomplete:'off'});
    var fd=field('Data','f-data',{type:'date'});
    two.appendChild(fv[0]);two.appendChild(fd[0]);sheet.appendChild(two);
    var fp=field('Pessoa','f-pessoa',{placeholder:'Nome',autocomplete:'off'});sheet.appendChild(fp[0]);
    var names=people();
    if(names.length){
      var pc=el('div','pchips');
      names.forEach(function(n){var c=el('button','chip',n);c.type='button';c.onclick=function(){fp[1].value=n};pc.appendChild(c)});
      sheet.appendChild(pc);
    }
    var fo=field('Observação (opcional)','f-obs',{placeholder:'Ex.: cartão, Pix…',autocomplete:'off'});sheet.appendChild(fo[0]);
    var err=el('div','err');err.setAttribute('role','alert');sheet.appendChild(err);
    var row=el('div','row2'),cancel=el('button',null,'Cancelar'),ok=el('button','ok','Salvar');
    cancel.type='button';ok.type='submit';cancel.onclick=closeOverlay;row.appendChild(cancel);row.appendChild(ok);sheet.appendChild(row);
    fd[1].value=editing?entry.data:todayStr();
    if(editing){fv[1].value=String(entry.valor).replace('.',',');fp[1].value=entry.pessoa;fo[1].value=entry.obs||''}
    else if(state.filter!=='todos')fp[1].value=state.filter;
    sheet.onsubmit=function(ev){
      ev.preventDefault();
      var v=parseMoney(fv[1].value),pes=fp[1].value.trim(),d=fd[1].value;
      if(!(v>0)){err.textContent='Informe um valor maior que zero.';return}
      if(!d){err.textContent='Escolha a data.';return}
      if(!pes){err.textContent='Informe a pessoa.';return}
      ok.disabled=true;ok.textContent='Salvando…';
      apiPost({action:'save',entry:{id:editing?entry.id:null,tipo:tipo,valor:v,data:d,pessoa:pes,obs:fo[1].value.trim()}}).then(function(){
        closeOverlay();state.open=null;render();toast(editing?'Lançamento atualizado':'Lançamento salvo');
      },function(){ok.disabled=false;ok.textContent='Salvar';err.textContent='Não foi possível salvar. Verifique a conexão e tente de novo.'});
    };
    setTimeout(function(){fv[1].focus()},50);
  }

  function openSettings(){
    closeOverlay();
    var sheet=sheetShell('Ajustes');
    var fr=field('Juros por dia (%)','f-rate',{inputmode:'decimal'});fr[1].value=String(state.rate).replace('.',',');
    sheet.appendChild(fr[0]);
    sheet.appendChild(el('div','sub','Juros compostos diários sobre o saldo devedor. Pagamentos abatem o saldo na data em que foram feitos.'));
    var err=el('div','err');sheet.appendChild(err);
    var row=el('div','row2'),c=el('button',null,'Fechar'),ok=el('button','ok','Salvar taxa');
    c.type='button';ok.type='submit';c.onclick=closeOverlay;row.appendChild(c);row.appendChild(ok);sheet.appendChild(row);
    var re=el('button','ghost','Trocar conexão com a planilha');re.type='button';re.onclick=function(){openSetup(true)};sheet.appendChild(re);
    sheet.onsubmit=function(ev){
      ev.preventDefault();var v=parseMoney(fr[1].value);
      if(!(v>=0&&v<100)){err.textContent='Informe um percentual válido.';return}
      ok.disabled=true;
      apiPost({action:'setRate',rate:v}).then(function(){closeOverlay();toast('Taxa atualizada')},
        function(){ok.disabled=false;err.textContent='Não foi possível salvar a taxa.'});
    };
  }

  function openSetup(canCancel){
    closeOverlay();
    var sheet=sheetShell('Conectar à planilha');
    sheet.appendChild(el('div','sub','Cole o endereço do app da planilha (Apps Script) e a chave. Isso é feito uma vez neste aparelho.'));
    var fu=field('Endereço (termina em /exec)','f-url',{type:'url',autocomplete:'off',placeholder:'https://script.google.com/macros/s/…/exec'});
    var fk=field('Chave','f-key',{autocomplete:'off'});
    fu[1].value=conn.url;fk[1].value=conn.key;
    sheet.appendChild(fu[0]);sheet.appendChild(fk[0]);
    var err=el('div','err');err.setAttribute('role','alert');sheet.appendChild(err);
    var row=el('div','row2'),ok=el('button','ok','Conectar');ok.type='submit';
    if(canCancel){var c=el('button',null,'Cancelar');c.type='button';c.onclick=closeOverlay;row.appendChild(c)}
    row.appendChild(ok);sheet.appendChild(row);
    sheet.onsubmit=function(ev){
      ev.preventDefault();
      var u=fu[1].value.trim(),k=fk[1].value.trim();
      if(!/^https:\/\/script\.google\.com\//.test(u)){err.textContent='O endereço deve começar com https://script.google.com/';return}
      if(!k){err.textContent='Informe a chave.';return}
      ok.disabled=true;ok.textContent='Conectando…';
      var old={url:conn.url,key:conn.key};conn.url=u;conn.key=k;
      apiGet().then(function(j){
        if(j.error)throw new Error(j.error);
        lsSet('emp_url',u);lsSet('emp_key',k);closeOverlay();apply(j);toast('Conectado');
      }).catch(function(x){
        conn.url=old.url;conn.key=old.key;ok.disabled=false;ok.textContent='Conectar';
        err.textContent=(x&&x.message==='unauthorized')?'Chave incorreta.':'Não consegui acessar. Confira o endereço e se a publicação permite "Qualquer pessoa".';
      });
    };
  }

  $('#addBtn').onclick=function(){if(!conn.key)openSetup(false);else openForm(null)};
  $('#rateBtn').onclick=function(){if(!conn.key)openSetup(false);else openSettings()};
  $('#refreshBtn').onclick=function(){refresh(false).then(function(){if(!state.offline)toast('Atualizado')})};
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeOverlay()});
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&conn.key&&!$('#overlay').firstChild)refresh(true)});

  loadConn();loadCache();render();
  if(!conn.key){state.ready=true;render();openSetup(false)}else refresh(true);

  if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
})();
</script>
</body>
</html>
